<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CDP - 房間預約系統</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 3px;
    }
    @media print {
      .no-print { display: none !important; }
      .print-only { display: block !important; }
      body { background: white; color: black; }
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-indigo-700 text-white shadow-md sticky top-0 z-30 no-print">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <div class="flex items-center space-x-3">
          <div class="p-2 bg-indigo-600 rounded-lg">
            <i data-lucide="building-2" class="w-6 h-6 text-indigo-100"></i>
          </div>
          <div>
            <h1 class="font-bold text-lg leading-tight">CDP</h1>
            <p class="text-xs text-indigo-200">場地預約與管理系統 (雲端即時同步)</p>
          </div>
        </div>
        
        <!-- Desktop Navigation Tabs -->
        <nav class="hidden md:flex space-x-1">
          <button id="tab-btn-booking" onclick="switchTab('booking')" class="flex items-center space-x-2 px-4 py-2 rounded-lg font-medium text-sm transition-colors bg-indigo-800 text-white shadow-inner">
            <i data-lucide="calendar-plus" class="w-4 h-4"></i>
            <span>場地預約</span>
          </button>
          <button id="tab-btn-lookup" onclick="switchTab('lookup')" class="flex items-center space-x-2 px-4 py-2 rounded-lg font-medium text-sm text-indigo-100 hover:bg-indigo-600 transition-colors">
            <i data-lucide="search" class="w-4 h-4"></i>
            <span>預約查詢</span>
          </button>
          <button id="tab-btn-admin" onclick="switchTab('admin')" class="flex items-center space-x-2 px-4 py-2 rounded-lg font-medium text-sm text-indigo-100 hover:bg-indigo-600 transition-colors">
            <i data-lucide="shield-check" class="w-4 h-4"></i>
            <span>管理員控制台</span>
          </button>
        </nav>
      </div>
    </div>
  </header>

  <!-- Mobile Navigation Bar -->
  <div class="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 z-30 flex justify-around p-2 shadow-lg no-print">
    <button onclick="switchTab('booking')" id="mobile-tab-booking" class="flex flex-col items-center p-2 text-indigo-600 font-semibold">
      <i data-lucide="calendar-plus" class="w-5 h-5"></i>
      <span class="text-xs mt-1 font-medium">預約場地</span>
    </button>
    <button onclick="switchTab('lookup')" id="mobile-tab-lookup" class="flex flex-col items-center p-2 text-slate-500">
      <i data-lucide="search" class="w-5 h-5"></i>
      <span class="text-xs mt-1 font-medium">查詢預約</span>
    </button>
    <button onclick="switchTab('admin')" id="mobile-tab-admin" class="flex flex-col items-center p-2 text-slate-500">
      <i data-lucide="shield-check" class="w-5 h-5"></i>
      <span class="text-xs mt-1 font-medium">管理後台</span>
    </button>
  </div>

  <!-- Loading Overlay -->
  <div id="sync-loading" class="fixed inset-0 bg-slate-900/40 backdrop-blur-xs z-50 flex flex-col items-center justify-center text-white space-y-3 hidden">
    <div class="w-10 h-10 border-4 border-white border-t-transparent rounded-full animate-spin"></div>
    <p class="text-sm font-medium">正在同步至 Google Sheets 雲端資料庫...</p>
  </div>

  <!-- Main Content Container -->
  <main class="flex-grow max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8 mb-16 md:mb-0">
    
    <!-- 1. BOOKING SECTION -->
    <section id="section-booking" class="space-y-6">
      <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200/80">
        <h2 class="text-xl font-bold text-slate-800 flex items-center gap-2 mb-2">
          <i data-lucide="calendar" class="w-5 h-5 text-indigo-600"></i>
          選擇預約場地與日期
        </h2>
        <p class="text-sm text-slate-500 mb-6">請選擇欲租用的房間、日期及可供預約的時間段。</p>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div id="room-card-hall" onclick="selectRoom('大廳')" class="cursor-pointer p-5 rounded-xl border-2 border-indigo-600 bg-indigo-50/50 transition-all flex items-start gap-4 hover:shadow-md">
            <div class="p-3 bg-indigo-600 text-white rounded-lg">
              <i data-lucide="landmark" class="w-6 h-6"></i>
            </div>
            <div class="flex-grow">
              <div class="flex justify-between items-center">
                <h3 class="font-bold text-slate
